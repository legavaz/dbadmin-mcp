[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dbadmin-mcp"
version = "1.1.0"
description = "MCP-сервер для эксплуатации PostgreSQL и MS SQL: размеры, блокировки, планы, удаление под контролем"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "legavaz" }]
keywords = ["mcp", "postgresql", "mssql", "1c", "dba", "model-context-protocol"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Database",
]
dependencies = ["psycopg[binary]>=3.1"]

[project.optional-dependencies]
mssql = ["pyodbc>=5.0"]
dev = ["pytest>=8"]

[project.scripts]
dbadmin-mcp = "dbadmin_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
